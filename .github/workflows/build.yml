name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (clang, lld, llvm)
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm

      - name: Test the hook engine (32-bit Linux)
        run: |
          clang -m32 -O2 -DDLLIMPORT= -ffreestanding -fno-builtin -fno-stack-protector -mno-sse -nostdlib -static \
            -fuse-ld=lld -fno-pic -no-pie tests/test_hook.c src/core/hook.c -o test_hook
          ./test_hook

      - name: Build DLLs
        run: tools/build.sh

      - name: Sign the co-op DLL
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          python3 tools/check_key.py "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in out/hybrid_coop.dll -out out/hybrid_coop.dll.sig
          rm -f "$RUNNER_TEMP/key.pem"
          cd out && sha256sum dinput8.dll hybrid_coop.dll hybrid_coop.dll.sig | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-coop-${{ github.sha }}
          path: |
            out/dinput8.dll
            out/hybrid_coop.dll
            out/hybrid_coop.dll.sig
            out/SHA256SUMS.txt
          if-no-files-found: ignore

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/dinput8.dll out/hybrid_coop.dll out/hybrid_coop.dll.sig out/SHA256SUMS.txt install/install_loader.bat install/uninstall_loader.bat \
            --title "Hybrid Co-op $GITHUB_REF_NAME" \
            --notes "Built and signed by GitHub Actions from commit $GITHUB_SHA. Players need only dinput8.dll (the loader); the co-op DLL comes with the Steam Workshop mod. Check the files against SHA256SUMS.txt."
